# Included from postgresql.conf (include_dir = 'conf.d'); read at the next restart.
ssl = on                                    # PG-03
ssl_cert_file = 'certs/server.crt'          # relative to the data directory
ssl_key_file = 'certs/server.key'
password_encryption = 'scram-sha-256'       # PG-02
shared_preload_libraries = 'pgaudit'        # PG-06
pgaudit.log = 'role, ddl'
pgaudit.role = 'auditor'                    # object audit: what 'auditor' may read is audited for everyone
pgaudit.log_relation = on
log_connections = 'receipt,authentication,authorization'   # PG-07 (PostgreSQL 18 takes a list)
log_disconnections = on
log_line_prefix = '%m [%p] user=%u db=%d client=%h '
logging_collector = on
log_destination = 'csvlog'
log_directory = 'log'
